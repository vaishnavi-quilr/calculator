# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

            # The job needs: permissions: { contents: read, security-events: write }
      - name: Quilr code scan
        env:
          QUILR_URL: https://threatlabs.quilrai.dev/api
          QUILR_SECURITY_URL: https://threatlabs.quilrai.dev/api
          QUILR_TOKEN: ${{ secrets.QUILR_TOKEN }}
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src -e QUILR_URL -e QUILR_SECURITY_URL -e QUILR_TOKEN -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_SHA -e GITHUB_REF -e GITHUB_REF_NAME -e GITHUB_HEAD_REF -e GITHUB_RUN_ID -e GITHUB_STEP_SUMMARY -v "$RUNNER_TEMP:$RUNNER_TEMP" ghcr.io/quilr/quilr-security-runner:latest code-scan --sarif quilr.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('quilr.sarif') != ''
        with:
          sarif_file: quilr.sarif
          category: quilr
      # After your build step, before the image is pushed:
      - name: Quilr image scan
        env:
          QUILR_URL: https://threatlabs.quilrai.dev/api
          QUILR_SECURITY_URL: https://threatlabs.quilrai.dev/api
          QUILR_TOKEN: ${{ secrets.QUILR_TOKEN }}
        run: |
          docker save ghcr.io/quilr/quilr-security-runner:latest:${{ github.sha }} -o image.tar
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src -e QUILR_URL -e QUILR_SECURITY_URL -e QUILR_TOKEN -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_SHA -e GITHUB_REF -e GITHUB_REF_NAME -e GITHUB_HEAD_REF -e GITHUB_RUN_ID -e GITHUB_STEP_SUMMARY -v "$RUNNER_TEMP:$RUNNER_TEMP" ghcr.io/quilr/quilr-security-runner:latest image-scan --image ghcr.io/quilr/quilr-security-runner:latest:${{ github.sha }} --archive image.tar


      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
