name: Quilr
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write   # findings in Security › Code scanning
  steps:
  - uses: actions/checkout@v4
  - name: Login to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ vaishnavi-quilr.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}
  - name: Quilr code scan
    run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src -e QUILR_URL -e QUILR_SECURITY_URL -e QUILR_TOKEN -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL ghcr.io/quilr/quilr-security-runner:latest
  - uses: github/codeql-action/upload-sarif@v3
    if: always() && hashFiles('quilr.sarif') != ''
    with:
      sarif_file: quilr.sarif
      category: quilr
jobs:
  quilr:
    runs-on: ubuntu-latest
    env:
      QUILR_URL: https://threatlabs.quilrai.dev/api
      QUILR_SECURITY_URL: https://threatlabs.quilrai.dev/api
      QUILR_TOKEN: ${{ secrets.QUILR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Quilr code scan
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src -e QUILR_URL -e QUILR_SECURITY_URL -e QUILR_TOKEN -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_SHA -e GITHUB_REF -e GITHUB_REF_NAME -e GITHUB_HEAD_REF -e GITHUB_RUN_ID -e GITHUB_STEP_SUMMARY -v "$RUNNER_TEMP:$RUNNER_TEMP" ghcr.io/quilr/quilr-security-runner:latest code-scan --sarif quilr.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('quilr.sarif') != ''
        with:
          sarif_file: quilr.sarif
          category: quilr
