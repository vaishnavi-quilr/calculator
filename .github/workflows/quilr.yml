name: Quilr
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write   # findings in Security › Code scanning
jobs:
  quilr:
    runs-on: ubuntu-latest
    env:
      QUILR_URL: https://threatlabs.quilrai.dev/api
      QUILR_SECURITY_URL: https://threatlabs.quilrai.dev/api
      QUILR_TOKEN: ${{ secrets.QUILR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      
      # Add this step to authenticate with ghcr.io
      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u $ --password-stdin
      
      - name: Quilr code scan
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src -e QUILR_URL -e QUILR_SECURITY_URL -e QUILR_TOKEN -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_REF ghcr.io/quilr/quilr-security-runner:latest
      
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('quilr.sarif') != ''
        with:
          sarif_file: quilr.sarif
          category: quilr
