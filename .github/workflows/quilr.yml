name: Quilr
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write   # findings in Security › Code scanning
  steps:
  - uses: actions/checkout@v4
  - name: Login to GitHub Container Registry
run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src -e QUILR_URL -e QUILR_SECURITY_URL -e QUILR_TOKEN -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL ghcr.io/quilr/quilr-security-runner:latest
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ vaishnavi-quilr.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}
jobs:
  quilr:
    runs-on: ubuntu-latest
    env:
      QUILR_URL: https://threatlabs.quilrai.dev/api
      QUILR_SECURITY_URL: https://threatlabs.quilrai.dev/api
      QUILR_TOKEN: ${{ secrets.QUILR_TOKEN }}

